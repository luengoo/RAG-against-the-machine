[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[project.scripts]
rag-against-the-machine = "rag_against_the_machine:main"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
